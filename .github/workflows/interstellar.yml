name: Interstellar

# Upstream's CI only runs on master/upcoming and also builds targets this hack does not use.
# This workflow builds the two that matter here, one per job: a fresh checkout each time keeps
# src/data/heal_locations.json intact, which is what breaks when both targets build in one tree.

on:
  push:
    branches: [interstellar]
  pull_request:
  workflow_dispatch:

jobs:
  firered:
    name: ROM (the hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: make firered
        run: make firered -j$(nproc) -O

  emerald:
    name: ROM (Emerald target, must keep compiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: make
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O
